apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-demo-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/FonsahPageo/gitops-assessment.git
    targetRevision: main
    path: helm/k8s-demo-api
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true