name: ci

on:
  push:
    branches: [main]
    paths:
      - "helloapi/**"
      - ".github/workflows/ci.yaml"
  pull_request:
      paths:
        - "helloapi/**"

# prevent race conditions when two pushes commit the new tag
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_DIR: helloapi
  IMAGE_NAME: helloapi

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: helloapi/pom.xml

      - name: Build and Test
        working-directory: ${{ env.APP_DIR }}
        run: mvn -V verify

  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Compute image name and tag
        id: meta
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # GHCR requires a lowercase path
          echo "IMAGE=${REGISTRY_URL}/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          push: true
          build-args: APP_COMMIT=${{ github.sha}}
          labels: org.opencontainers.image.source=${{ github.server_url}}/${{ github.repository }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag}}
            ${{ env.IMAGE}}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-manifest:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set new image tag in Helm values
        env:
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          sed -i "s|^  tag: .*|  tag: \"${TAG}\"|" helm/helloapi/values.yaml
          grep -n "^  tag:" helm/helloapi/values.yaml

      - name: Commit and push
        env:
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/helloapi/values.yaml
          if git diff --cached --quiet; then
            echo "No change to commit"
            exit 0
          fi
          git commit -m "ci: deploy helloapi ${TAG} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
