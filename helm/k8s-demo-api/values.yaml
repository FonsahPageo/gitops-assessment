replicaCount: 2

image:
  repository: ghcr.io/fonsahpageo/helloapi
  tag: "40b1cf9"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull-secret

containerPort: 8080

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  nodePort: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  startup:
    path: /api/health
    periodSeconds: 5
    failureThreshold: 30
  readiness:
    path: /api/health
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    path: /api/health
    initialDelaySeconds: 10
    periodSeconds: 20

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}

nameOverride: ""
fullnameOverride: ""
