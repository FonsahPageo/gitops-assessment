replicaCount: 1

image:
  repository: ghcr.io/fonsahpageo/helloapi
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull-secret

containerPort: 8080

service:
  type: NodePort
  port: 80
  nodePort: 30080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ["ALL"]

nodeSelector: {}

nameOverride: ""
fullnameOverride: ""
